name: create-habit
method: POST
url: http://localhost:4000/api/v1/habits/
body:
  content: |-
    {
      "title" : "Baca 10 menit",
      "type" : "POSITIVE",
      "description" : "Baca setiap malam"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $ACCESS_TOKEN
headers:
- name: content-type
  value: application/json
scripts:
  on_response: scripts/habit_handler.py:on_habit_response
