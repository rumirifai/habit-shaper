# docker-compose.yml (dev) — SAD §1.2 Phase 0
# web :3000 -> api :4000 -> db :5432
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-habitshaper}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-habit} -d $${POSTGRES_DB:-habitshaper}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: npm run dev --workspace @habit-shaper/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      TZ: Asia/Jakarta
      # Polling agar tsx watch mendeteksi perubahan via bind mount
      # Docker Desktop (Windows).
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      DATABASE_URL: postgresql://${POSTGRES_USER:-habit}:${POSTGRES_PASSWORD:-habit_dev_password}@db:5432/${POSTGRES_DB:-habitshaper}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_32_chars_min}
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./packages/shared/src:/app/packages/shared/src
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: npm run dev --workspace @habit-shaper/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      # Polling agar file watcher Next mendeteksi perubahan via bind mount
      # Docker Desktop (Windows). Tanpa ini, edit file sering tidak memicu recompile.
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared/src:/app/packages/shared/src
      - ./tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules

volumes:
  pgdata:
